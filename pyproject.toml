[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coflowai"
version = "1.0.0"
description = "Production-grade agentic AI framework: deterministic runtime, provider-independent models, replayable executions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "workflow", "orchestration", "agentic-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# Core dependency graph stays intentionally tiny (§73).
dependencies = [
    "pydantic>=2",
    "typing-extensions",
]

[project.optional-dependencies]
# Providers (all HTTP adapters share the httpx transport)
http = ["httpx>=0.27"]
openai = ["httpx>=0.27"]
anthropic = ["httpx>=0.27"]
gemini = ["httpx>=0.27"]
bedrock = ["boto3>=1.34"]
# Persistence — note sqlite needs nothing at all (stdlib)
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5"]
qdrant = ["qdrant-client>=1.9"]
observability = ["structlog>=24", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
# Everything except cloud SDKs
all = ["httpx>=0.27", "asyncpg>=0.29", "redis>=5", "structlog>=24",
       "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
coflowai = "coflowai.cli:main"

[project.entry-points."coflowai.plugins"]
# third-party packages register plugins here, e.g.
# openai = "coflowai_openai:OpenAIPlugin"

[tool.hatch.build.targets.wheel]
packages = ["coflowai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning", "ignore::pytest.PytestConfigWarning"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
